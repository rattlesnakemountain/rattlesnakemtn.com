<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terms of Use · Rattlesnake Mountain</title>
    <meta name="description" content="Terms of use for rattlesnakemtn.com, including the accuracy and safety-reliance disclaimer for station and forecast data." />
    <link rel="icon" href="/png/icon-192.png" />
    <link rel="apple-touch-icon" href="/png/apple-touch.png" />
    <script>
      // Apply the stored or system theme before first paint to avoid a flash.
      const stored = localStorage.getItem("theme");
      const dark =
        stored === "dark" ||
        (stored !== "light" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pages/terms.tsx"></script>
  </body>
</html>
